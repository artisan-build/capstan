name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Add '8.6' here when it reaches RC to check upgrade-readiness.
        php: ['8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          # Proves the Built for Cloud auth-foundation opt-outs hold on a fresh
          # database: no invitations collision, no stray users.is_admin column.
          php artisan migrate:fresh --force

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run Pest
        run: php artisan test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  tests-postgres:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Add '8.6' here when it reaches RC to check upgrade-readiness.
        php: ['8.5']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: pdo_pgsql, pgsql

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run Pest
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  # Stable required check that aggregates the test matrix, so branch protection needn't change when PHP versions are added/removed.
  ci:
    name: ci
    needs: [tests, tests-postgres]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on matrix test results
        run: |
          [ "${{ needs.tests.result }}" = "success" ] \
            && [ "${{ needs.tests-postgres.result }}" = "success" ]
